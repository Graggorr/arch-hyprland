# Wire systemd-oomd to the actual desktop session (user-<uid>.slice and
# everything nested under it: app.slice, session.slice, background.slice —
# where browsers/Electron apps actually balloon). Vanilla Arch doesn't ship
# this by default (Fedora does); without it oomd only watches system.slice
# and a runaway desktop app just thrashes until the kernel's own OOM killer
# eventually acts, which is what caused the freeze at ~30GiB usage.
[Slice]
ManagedOOMSwap=auto
ManagedOOMMemoryPressure=auto
ManagedOOMMemoryPressureLimit=50%
