# Lets gamemode renice games to a negative nice value.
#
# setpriority() checks RLIMIT_NICE of the *target*, not the caller, so it is the
# game that needs the allowance — not gamemoded. This session is hyprland-uwsm,
# meaning Hyprland runs as wayland-wm@hyprland.desktop.service and Steam and
# every game inherit their limits from `systemd --user`, which is spawned by this
# unit. No SDDM PAM stack on this machine includes pam_limits, so the
# /etc/security/limits.d/10-gamemode.conf that the gamemode package ships never
# reaches a game and is inert on its own. The user manager cannot raise its own
# hard limit, so it has to be granted here.
#
# Takes effect at next login (or a restart of user@1000.service, which ends the
# graphical session). Verify with: grep -i nice /proc/$(pgrep -x steam)/limits
[Service]
LimitNICE=-10
