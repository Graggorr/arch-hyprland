[general]
; Renice the registered game by -10. This is the one thing the quickshell game
; mode cannot do by itself: RLIMIT_NICE is 0 for normal users, so negative nice
; needs the @gamemode group's allowance from /etc/security/limits.d/10-gamemode.conf.
; Off by default in gamemode ("Passed (no renice configured)"), hence this file.
renice=10

; Nothing on this machine implements org.freedesktop.ScreenSaver — quickshell owns
; the lock screen and hypridle handles idling — so every game start otherwise logs
; "Failed to call Inhibit on org.freedesktop.ScreenSaver: not activatable".
inhibit_screensaver=0

; The CPU governor is deliberately left alone: power-profiles-daemon already holds
; this machine at the performance profile, and gamemode fighting PPD over the same
; sysfs knob would just mean two owners for one setting.
