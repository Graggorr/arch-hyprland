# Flags appended by /usr/bin/google-chrome-stable at launch.
# Read only if XDG_CONFIG_HOME is set (it is, via the systemd user env).

# Windows-style middle-click autoscroll (the "scroll circle").
# Middle-click, then move the mouse to scroll continuously.
# Trade-off: Chrome shows an "unsupported command-line flag" bubble on
# every launch. Delete this line to revert.
--enable-blink-features=MiddleClickAutoscroll
