background {
    monitor =
    path = ~/.config/hypr/.lockscreen-bg
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

general {
    hide_cursor = true
    grace = 0
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME12
    font_size = 64
    font_family = Fira Sans Semi-Bold
    color = rgba(cdd6f4ff)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = Fira Sans
    color = rgba(cdd6f4cc)
    position = 0, 50
    halign = center
    valign = center
}

# active keyboard layout — verify before typing the password (us/ru/ua)
label {
    monitor =
    text = $LAYOUT
    font_size = 16
    font_family = Fira Sans
    color = rgba(89b4faff)
    position = 0, 30
    halign = center
    valign = bottom
}
