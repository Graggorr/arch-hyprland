general {
    lock_cmd = qs ipc call lock lock
    after_sleep_cmd = @HOME@/.config/hypr/scripts/idle-mode.sh resume   # wake displays on resume

    ignore_wayland_inhibit = true                # apps (Chrome video, Claude desktop) can't veto suspend
    ignore_dbus_inhibit = true                   # same for Steam/Firefox-style ScreenSaver inhibits
    ignore_systemd_inhibit = true                # same for systemd-inhibit --what=idle
}

listener {
    timeout = 3600                               # 60 min -> whatever idle-mode says
    on-timeout = @HOME@/.config/hypr/scripts/idle-mode.sh timeout
    on-resume = @HOME@/.config/hypr/scripts/idle-mode.sh resume
    condition_cmd = @HOME@/.local/bin/idle-media-guard   # non-zero = media playing, don't act
    condition_retry = 300                        # re-check every 5 min until media stops
}
