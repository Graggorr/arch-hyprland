screencopy {
    # Let apps reuse their last screen-share selection via restore tokens —
    # the share picker only appears the first time per app.
    allow_token_by_default = true

    # Alt+P (discord-stream) arms a one-shot flag so Discord's share request is
    # answered with DP-2 directly; every other request falls through to the
    # stock hyprland-share-picker.
    custom_picker_binary = @HOME@/.config/hypr/scripts/share-picker.sh
}
