; The call's second ear: the same shape as cava.conf, pointed at the default
; source instead of the sink monitor, so the island's call waveform moves for
; your own voice as well as the other side's. Runs only while a call is up.
[general]
mode = normal
framerate = 24
bars = 12
sensitivity = 120
autosens = 0

[input]
method = pulse
source = @DEFAULT_SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 32
